  <body>
    <div id="panel" class="cuerpo oculto">
      <div class="escaneo" aria-hidden="true"></div>
      <header class="cabecera">
        <div class="cabecera__fila">
          <span class="cabecera__nombre">NETRUNNER//PANEL</span>
          <div class="cabecera__der">
            <span class="cabecera__hora" id="hora">--:--:--</span>
            <button class="cabecera__ajustes" id="ajustes" type="button" title="Ajustes" aria-label="Ajustes">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M10.5 2.5h3l.5 2.4 1.9.8 2.1-1.4 2.1 2.1-1.4 2.1.8 1.9 2.4.5v3l-2.4.5-.8 1.9 1.4 2.1-2.1 2.1-2.1-1.4-1.9.8-.5 2.4h-3l-.5-2.4-1.9-.8-2.1 1.4-2.1-2.1 1.4-2.1-.8-1.9-2.4-.5v-3l2.4-.5.8-1.9-1.4-2.1 2.1-2.1 2.1 1.4 1.9-.8z"/></svg>
            </button>
          </div>
        </div>
        <div class="franja">
          <div class="franja__datos">
            <span class="enlace" id="enlace">LINK <i class="enlace__punto">●</i></span>
            <span class="franja__micro">OS_SYSTEM // 0x3F</span>
            <span class="franja__micro franja__carga">LOADING <i class="franja__barra"></i></span>
          </div>
          <canvas class="franja__wire" id="wire" aria-hidden="true"></canvas>
        </div>
      </header>
      <div class="banda"></div>
      <main id="contenido" class="contenido"></main>
      <nav id="pestanas" class="pestanas"></nav>
      <footer class="pie"><span class="pie__banda"></span><span class="pie__texto" id="version">NETRUNNER//PANEL</span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>

</html>

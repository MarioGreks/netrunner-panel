[package]
name = "netrunner-panel-setup"
version = "1.8.3"
description = "Instalador HUD de Netrunner Panel"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"

[features]
# Incrusta la interfaz (instalador/dist) en el exe. Sin ella, el exe carga devUrl
# (localhost:1430). `tauri build` la activa solo; con `cargo build` hay que pasarla.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

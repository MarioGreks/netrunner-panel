[package]
name = "netrunner-panel"
version = "0.1.0"
description = "Panel de escritorio estilo cyberpunk HUD"
edition = "2021"

[lib]
name = "netrunner_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
